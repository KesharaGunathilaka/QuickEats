# Production stack: pulls prebuilt images, publishes only Kong (host port 80).
#
#   cp .env.prod.example .env.prod      # then fill in real values
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Needs these repo files on the server: infra/ and services/*/migrations/.

x-service-defaults: &service-defaults
  restart: unless-stopped
  # Each service answers GET /health on its own PORT; the pipeline waits for "healthy".
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$$PORT/health || exit 1"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
  depends_on:
    seed:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    kafka:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: quickeats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickeats"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Holds the live stock counters and processed-event IDs, so it keeps its data
  # (append-only file) across restarts and redeploys.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Single-node Kafka in KRaft mode (no ZooKeeper). Internal only, no host port.
  # Heap is capped so it fits next to the rest of the stack and Jenkins on one instance.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: apply each service's migrations to its own database
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./services:/services:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for svc in identity catalog order payment; do
          echo "migrating $$svc"
          migrate -path /services/$$svc/migrations -database "postgres://quickeats:${POSTGRES_PASSWORD}@postgres:5432/$${svc}_db?sslmode=disable" up
        done
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: load demo data (idempotent)
  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infra/seed-dev.sql:/seed-dev.sql:ro
    command: ["psql", "-h", "postgres", "-U", "quickeats", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/seed-dev.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  # The only container reachable from outside. Admin API is disabled.
  kong:
    image: kong:3.6
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "off"
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml:ro
    depends_on:
      - identity
      - catalog
      - order
      - payment
      - notification
      - admin

  identity:
    <<: *service-defaults
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX in .env.prod}/quickeats-identity:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://quickeats:${POSTGRES_PASSWORD}@postgres:5432/identity_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      CATALOG_SERVICE_URL: http://catalog:8082
      PORT: "8081"
      # Admin dashboard login, created on first start if it doesn't exist
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

  catalog:
    <<: *service-defaults
    image: ${IMAGE_PREFIX}/quickeats-catalog:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://quickeats:${POSTGRES_PASSWORD}@postgres:5432/catalog_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      PORT: "8082"

  order:
    <<: *service-defaults
    image: ${IMAGE_PREFIX}/quickeats-order:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://quickeats:${POSTGRES_PASSWORD}@postgres:5432/order_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      CATALOG_SERVICE_URL: http://catalog:8082
      PAYMENT_SERVICE_URL: http://payment:8084
      PORT: "8083"

  payment:
    <<: *service-defaults
    image: ${IMAGE_PREFIX}/quickeats-payment:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://quickeats:${POSTGRES_PASSWORD}@postgres:5432/payment_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      PAYHERE_MERCHANT_ID: ${PAYHERE_MERCHANT_ID:-}
      PAYHERE_MERCHANT_SECRET: ${PAYHERE_MERCHANT_SECRET:-}
      PORT: "8084"

  notification:
    restart: unless-stopped
    image: ${IMAGE_PREFIX}/quickeats-notification:${IMAGE_TAG:-latest}
    environment:
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET}
      HTTP_PORT: "8085"
      WS_PORT: "8086"
      ORDER_SERVICE_URL: http://order:8083
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # React admin dashboard (static files), served by Kong at /admin
  admin:
    image: ${IMAGE_PREFIX}/quickeats-admin:${IMAGE_TAG:-latest}
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: in this image localhost resolves to IPv6 ::1 first,
      # and nginx only listens on IPv4
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
  kafkadata:
  redisdata:
