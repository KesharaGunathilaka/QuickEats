version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: quickeats
      POSTGRES_PASSWORD: quickeats
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickeats"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Containers use kafka:29092; services run on the host (make run-*) use localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # One-shot: apply each service's migrations to its own database
  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./services:/services:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for svc in identity catalog order payment; do
          echo "migrating $$svc"
          migrate -path /services/$$svc/migrations -database "postgres://quickeats:quickeats@postgres:5432/$${svc}_db?sslmode=disable" up
        done
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: load dev data (idempotent)
  seed:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: quickeats
    volumes:
      - ./infra/seed-dev.sql:/seed-dev.sql:ro
    command: ["psql", "-h", "postgres", "-U", "quickeats", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-f", "/seed-dev.sql"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  kong:
    image: kong:3.6
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
    volumes:
      - ./infra/kong/kong.yml:/etc/kong/kong.yml
    depends_on:
      - identity
      - catalog
      - order
      - payment
      - notification

  identity:
    restart: on-failure
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://quickeats:quickeats@postgres:5432/identity_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      CATALOG_SERVICE_URL: http://catalog:8082
      PORT: "8081"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  catalog:
    restart: on-failure
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://quickeats:quickeats@postgres:5432/catalog_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      PORT: "8082"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  order:
    restart: on-failure
    build:
      context: .
      dockerfile: services/order/Dockerfile
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://quickeats:quickeats@postgres:5432/order_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      CATALOG_SERVICE_URL: http://catalog:8082
      PAYMENT_SERVICE_URL: http://payment:8084
      PORT: "8083"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  payment:
    restart: on-failure
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://quickeats:quickeats@postgres:5432/payment_db?sslmode=disable
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      PORT: "8084"
    depends_on:
      seed:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    restart: on-failure
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    ports:
      - "8085:8085"
      - "8086:8086"
    environment:
      REDIS_URL: redis:6379
      KAFKA_BROKERS: kafka:29092
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in quickeats-backend/.env}
      HTTP_PORT: "8085"
      WS_PORT: "8086"
      ORDER_SERVICE_URL: http://order:8083
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:
  kafkadata:
