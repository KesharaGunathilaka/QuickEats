name: quickeats_customer
description: QuickEats Customer App — browse shops, order food, track pickup.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  get_it: ^7.6.7
  dio: ^5.4.3+1
  go_router: ^14.2.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  badges: ^3.1.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  json_serializable: ^6.7.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/
